<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Portal | Agentics Foundation</title>
  <link rel="icon" type="image/x-icon" href="https://agentics.org/favicon.ico">
  <style>
    :root {
      --primary: #E25A3C;
      --primary-dark: #C94A2E;
      --primary-light: #F07A60;
      --text-dark: #1a1a1a;
      --text-muted: #666666;
      --bg-light: #f5f5f5;
      --white: #ffffff;
      --border: #e0e0e0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #E25A3C 0%, #C94A2E 50%, #A13D26 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header a {
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }
    .header a:hover {
      opacity: 1;
      text-decoration: underline;
    }
    .container {
      max-width: 600px;
      margin: 0 auto 40px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.2);
    }
    h1 {
      color: var(--text-dark);
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dark);
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { min-height: 150px; resize: vertical; }
    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .ticket-id {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }
    .nav {
      text-align: center;
      margin-top: 20px;
    }
    .nav a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .nav a:hover {
      text-decoration: underline;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.8);
      font-size: 13px;
    }
    .footer a {
      color: var(--white);
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="https://agentics.org">← Back to agentics.org</a>
  </div>

  <div class="container">
    <h1>Support Portal</h1>
    <p class="subtitle">Submit a ticket and we'll get back to you soon</p>

    <form id="ticketForm">
      <div class="form-group">
        <label for="name">Your Name *</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject *</label>
        <input type="text" id="subject" required>
      </div>

      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <textarea id="description" required placeholder="Please describe your issue..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Submit Ticket</button>
    </form>

    <div id="message" class="message"></div>

    <div class="nav">
      <a href="view-ticket.html">View My Tickets</a>
    </div>
  </div>

  <div class="footer">
    <a href="https://agentics.org">Agentics Foundation</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://your-project.supabase.co/functions/v1/submit-ticket';

    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      msg.style.display = 'none';

      try {
        const response = await fetch(SUPABASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            subject: document.getElementById('subject').value,
            description: document.getElementById('description').value,
            priority: document.getElementById('priority').value
          })
        });

        const result = await response.json();

        if (result.success) {
          msg.className = 'message success';
          msg.innerHTML = `
            <strong>✅ Ticket Created!</strong><br>
            <div class="ticket-id">${result.ticketId}</div>
            <p>Check your email for confirmation and updates.</p>
          `;
          msg.style.display = 'block';
          document.getElementById('ticketForm').reset();
        } else {
          throw new Error(result.error);
        }

      } catch (error) {
        msg.className = 'message error';
        msg.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Ticket';
      }
    });
  </script>
</body>
</html>
