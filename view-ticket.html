<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Ticket | Agentics Foundation</title>
  <link rel="icon" type="image/x-icon" href="https://agentics.org/favicon.ico">
  <style>
    :root {
      --primary: #E25A3C;
      --primary-dark: #C94A2E;
      --primary-light: #F07A60;
      --text-dark: #1a1a1a;
      --text-muted: #666666;
      --bg-light: #f5f5f5;
      --white: #ffffff;
      --border: #e0e0e0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #E25A3C 0%, #C94A2E 50%, #A13D26 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header a {
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }
    .header a:hover {
      opacity: 1;
      text-decoration: underline;
    }
    .container {
      max-width: 800px;
      margin: 0 auto 40px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.2);
    }
    h1 {
      color: var(--text-dark);
      margin-bottom: 30px;
      font-size: 28px;
    }
    .secure-notice {
      background: #f0f4ff;
      border: 1px solid var(--primary);
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ticket-card {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .ticket-id {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }
    .status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status.open { background: #d4edda; color: #155724; }
    .status.in_progress { background: #fff3cd; color: #856404; }
    .status.closed { background: #d1ecf1; color: #0c5460; }
    .status.resolved { background: #cce5ff; color: #004085; }
    .description {
      white-space: pre-wrap;
      color: var(--text-muted);
      margin: 10px 0;
      line-height: 1.6;
    }
    .meta {
      font-size: 12px;
      color: #999;
      margin-top: 15px;
    }
    .update {
      background: var(--bg-light);
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
    }
    .update-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .message {
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
    }
    .message.error {
      color: #721c24;
      background: #f8d7da;
      border-radius: 8px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .loading::after {
      content: '';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
    .nav {
      text-align: center;
      margin-top: 20px;
    }
    .nav a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .nav a:hover {
      text-decoration: underline;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.8);
      font-size: 13px;
    }
    .footer a {
      color: var(--white);
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="https://agentics.org">← Back to agentics.org</a>
  </div>

  <div class="container">
    <h1>View Ticket</h1>

    <div id="secure-notice" class="secure-notice" style="display: none;">
      <span>🔒</span>
      <span>This is your private ticket view. The link contains a secure token.</span>
    </div>

    <div id="content">
      <div class="loading">Loading ticket</div>
    </div>

    <div class="nav">
      <a href="index.html">← Submit New Ticket</a>
    </div>
  </div>

  <div class="footer">
    <a href="https://agentics.org">Agentics Foundation</a>
  </div>

  <script>
    const SUPABASE_FUNCTION_URL = 'https://xeudmuqefyptputmxgul.supabase.co/functions/v1/get-ticket';

    async function loadTicket() {
      const content = document.getElementById('content');
      const secureNotice = document.getElementById('secure-notice');

      // Get params from URL
      const urlParams = new URLSearchParams(window.location.search);
      const ticketId = urlParams.get('id');
      const token = urlParams.get('token');

      if (!ticketId || !token) {
        content.innerHTML = `
          <div class="message error">
            <strong>Invalid Link</strong><br><br>
            This ticket link is missing required parameters.<br>
            Please use the link from your confirmation email.
          </div>
        `;
        return;
      }

      // Show secure notice
      secureNotice.style.display = 'flex';

      try {
        const response = await fetch(`${SUPABASE_FUNCTION_URL}?id=${encodeURIComponent(ticketId)}&token=${encodeURIComponent(token)}`);

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to load ticket');
        }

        const { ticket, updates } = await response.json();

        // Render ticket
        content.innerHTML = `
          <div class="ticket-card">
            <div class="ticket-header">
              <div class="ticket-id">${escapeHtml(ticket.ticket_id)}</div>
              <span class="status ${ticket.status}">${escapeHtml(ticket.status.replace('_', ' '))}</span>
            </div>

            <h3>${escapeHtml(ticket.subject)}</h3>
            <div class="description">${escapeHtml(ticket.description)}</div>

            <div class="meta">
              <strong>Created:</strong> ${new Date(ticket.created_at).toLocaleString()}<br>
              <strong>Priority:</strong> ${escapeHtml(ticket.priority)}<br>
              <strong>Last Updated:</strong> ${new Date(ticket.updated_at).toLocaleString()}
            </div>

            ${updates && updates.length > 0 ? `
              <div style="margin-top: 20px;">
                <strong>Updates:</strong>
                ${updates.map(u => `
                  <div class="update">
                    <div class="update-meta">
                      <strong>${escapeHtml(u.author_name)}</strong> • ${new Date(u.created_at).toLocaleString()}
                    </div>
                    ${u.update_type === 'status_change'
                      ? `<p>Status changed from <strong>${escapeHtml(u.old_status || 'unknown')}</strong> to <strong>${escapeHtml(u.new_status || 'unknown')}</strong></p>`
                      : `<p style="white-space: pre-wrap;">${escapeHtml(u.content || '')}</p>`
                    }
                  </div>
                `).join('')}
              </div>
            ` : '<p style="margin-top: 20px; color: #666;">No updates yet. You\'ll receive an email when there\'s an update.</p>'}
          </div>
        `;

      } catch (error) {
        content.innerHTML = `
          <div class="message error">
            <strong>Unable to Load Ticket</strong><br><br>
            ${escapeHtml(error.message)}<br><br>
            Please check that you're using the correct link from your email.
          </div>
        `;
      }
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load ticket on page load
    loadTicket();
  </script>
</body>
</html>
