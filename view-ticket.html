<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Ticket | Agentics Foundation</title>
  <link rel="icon" type="image/x-icon" href="https://agentics.org/favicon.ico">
  <style>
    :root {
      --primary: #E25A3C;
      --primary-dark: #C94A2E;
      --primary-light: #F07A60;
      --text-dark: #1a1a1a;
      --text-muted: #666666;
      --bg-light: #f5f5f5;
      --white: #ffffff;
      --border: #e0e0e0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #E25A3C 0%, #C94A2E 50%, #A13D26 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header a {
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }
    .header a:hover {
      opacity: 1;
      text-decoration: underline;
    }
    .container {
      max-width: 800px;
      margin: 0 auto 40px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.2);
    }
    h1 {
      color: var(--text-dark);
      margin-bottom: 30px;
      font-size: 28px;
    }
    .search-box {
      display: grid;
      grid-template-columns: 2fr 3fr auto;
      gap: 10px;
      margin-bottom: 30px;
    }
    @media (max-width: 600px) {
      .search-box {
        grid-template-columns: 1fr;
      }
    }
    input {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      padding: 12px 24px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
    .ticket-card {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .ticket-id {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }
    .status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status.open { background: #d4edda; color: #155724; }
    .status.in_progress { background: #fff3cd; color: #856404; }
    .status.closed { background: #d1ecf1; color: #0c5460; }
    .update {
      background: var(--bg-light);
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
    }
    .update-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
    }
    .nav {
      text-align: center;
      margin-top: 20px;
    }
    .nav a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .nav a:hover {
      text-decoration: underline;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.8);
      font-size: 13px;
    }
    .footer a {
      color: var(--white);
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="https://agentics.org">← Back to agentics.org</a>
  </div>

  <div class="container">
    <h1>View My Tickets</h1>

    <div class="search-box">
      <input type="text" id="ticketId" placeholder="Ticket ID (e.g., TKT-2024-0001)">
      <input type="email" id="email" placeholder="Your email address">
      <button onclick="searchTicket()">Search</button>
    </div>

    <div id="results"></div>

    <div class="nav">
      <a href="index.html">← Submit New Ticket</a>
    </div>
  </div>

  <div class="footer">
    <a href="https://agentics.org">Agentics Foundation</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_KEY = 'your-anon-key';

    // Check URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('id') && urlParams.get('email')) {
      document.getElementById('ticketId').value = urlParams.get('id');
      document.getElementById('email').value = urlParams.get('email');
      searchTicket();
    }

    async function searchTicket() {
      const ticketId = document.getElementById('ticketId').value.trim();
      const email = document.getElementById('email').value.trim();
      const results = document.getElementById('results');

      if (!ticketId || !email) {
        results.innerHTML = '<div class="no-results">Please enter both ticket ID and email</div>';
        return;
      }

      results.innerHTML = '<div class="no-results">Searching...</div>';

      try {
        // Get ticket
        const ticketResponse = await fetch(
          `${SUPABASE_URL}/rest/v1/tickets?ticket_id=eq.${ticketId}&email=eq.${email}&select=*`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Content-Type': 'application/json'
            }
          }
        );

        const tickets = await ticketResponse.json();

        if (!tickets || tickets.length === 0) {
          results.innerHTML = '<div class="no-results">Ticket not found. Please check your ticket ID and email.</div>';
          return;
        }

        const ticket = tickets[0];

        // Get updates
        const updatesResponse = await fetch(
          `${SUPABASE_URL}/rest/v1/ticket_updates?ticket_id=eq.${ticketId}&order=created_at.desc&select=*`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Content-Type': 'application/json'
            }
          }
        );

        const updates = await updatesResponse.json();

        // Display ticket
        results.innerHTML = `
          <div class="ticket-card">
            <div class="ticket-header">
              <div class="ticket-id">${ticket.ticket_id}</div>
              <span class="status ${ticket.status}">${ticket.status.replace('_', ' ')}</span>
            </div>
            
            <h3>${ticket.subject}</h3>
            <p style="color: #666; margin: 10px 0;">${ticket.description}</p>
            
            <div style="font-size: 12px; color: #999; margin-top: 15px;">
              Created: ${new Date(ticket.created_at).toLocaleString()}<br>
              Priority: ${ticket.priority}
            </div>
            
            ${updates && updates.length > 0 ? `
              <div style="margin-top: 20px;">
                <strong>Updates:</strong>
                ${updates.map(u => `
                  <div class="update">
                    <div class="update-meta">
                      ${u.author_name} • ${new Date(u.created_at).toLocaleString()}
                    </div>
                    ${u.update_type === 'status_change' 
                      ? `<p>Status changed from <strong>${u.old_status}</strong> to <strong>${u.new_status}</strong></p>`
                      : `<p>${u.content}</p>`
                    }
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;

      } catch (error) {
        results.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
